# Corryvreckan detector geometry -- TEMPLATE for a new telescope setup (initial, ideal placement).
#
# 7 MALTA2 planes on a straight beam axis, beam along +z, MALTA_3 (the middle plane) is the DUT.
# Make a new setup by copying this directory to geometry/<NAME>/ and editing only the
# lines marked "EDIT" below (z of each plane, upstream first).
# Then analyse with  scripts/run_chain.sh --setup <NAME> --run <RUN>
#
# Only z has to be right (to ~1 mm). x/y offsets and rotations stay 0: Prealignment / Alignment
# (Millepede) / AlignmentDUT find them and write geometry/<NAME>/{prealigned,aligned,aligned_dut}.conf.
# Keep the DUT on role = "dut" and exactly one plane (MALTA_0) on role = "reference".
#
# Values below = dec2026_C1p5 (all gaps 1.5 cm):
#   MALTA_0  MALTA_1  MALTA_2  [MALTA_3=DUT]  MALTA_4  MALTA_5  MALTA_6
#   -45      -30      -15       0             +15      +30      +45      mm

[MALTA_0]
coordinates = "cartesian"
type = "MALTA2"
position = 0um, 0um, -45mm   # <-- EDIT: z of this plane
orientation_mode = "xyz"
orientation = 0deg, 0deg, 0deg
alignment_precision_position = 0um 0um 0um
alignment_precision_orientation = 0deg 0deg 0deg
pixel_pitch = 36.4um, 36.4um
number_of_pixels = 512, 224
spatial_resolution = 10.5um, 10.5um
time_resolution = 5ns
role = "reference"
material_budget = 0.00106768

