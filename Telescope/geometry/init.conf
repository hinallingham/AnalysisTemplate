# Corryvreckon detector geometry - initial (ideal) placement.
#
# 7 planes on a straight beam axis, 1 inch (2.54 cm) pitch between
# neighbours, MALTA_3 (the middle plane) is the DUT.
#
#   MALTA_0  MALTA_1  MALTA_2  [MALTA_3=DUT]  MALTA_4  MALTA_5  MALTA_6
#   -7.62cm  -5.08cm  -2.54cm   0cm            2.54cm   5.08cm   7.62cm
#
# x/y offsets and rotations are left at 0 here -- NoiseMasking only adds
# mask_file entries, Prealignment/Alignment then update x/y/rotation in
# geometry/masked.conf -> prealigned.conf -> aligned.conf.

[MALTA_0]
coordinates = "cartesian"
type = "MALTA2"
position = 0um, 0um, -7.62cm
orientation_mode = "xyz"
orientation = 0deg, 0deg, 0deg
alignment_precision_position = 0um 0um 0um
alignment_precision_orientation = 0deg 0deg 0deg
pixel_pitch = 36.4um, 36.4um
number_of_pixels = 512, 224
spatial_resolution = 10.5um, 10.5um
time_resolution = 5ns
role = "reference"
material_budget = 0.00106768

