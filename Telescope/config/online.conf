# Online monitor -- run this ALONGSIDE an active data-taking run to watch the
# telescope live: hitmaps, correlations, tracking, residual trends and the
# L1idC/DAQ health canvas. It reads the run files while MaltaDAQ is still
# writing them, and never writes a geometry file back, so it is safe to start
# and stop at any point during a run.
#
# Run via:
#     corry -c online.conf \
#         -o EventLoaderMALTA.run_number=<run>
#
# base_path below already points at Telescope/data, so nothing else is needed
# for the standard layout. To read from anywhere else, pass an ABSOLUTE path:
#         -o EventLoaderMALTA.base_path=/data/beamtime/whatever
# A relative one would break: corry chdir's into output_directory at startup,
# and base_path is a plain string option, so it resolves against
# output/online/ -- not against this config file or your shell's cwd. Only
# "path"-type options (detectors_file, output_directory) are resolved
# relative to this file.
#
# For Malta2TreeWriter (Allpix simulation) data, add
#         -o EventLoaderMALTA.real_data=false
# -- the same thing the step scripts' --sim-data flag does.
#
# The GUI needs a display -- this cannot run in a headless/batch session.
# Keyboard: Space = pause, F = full screen, S = save PNG, 1-9 = switch canvas.
#
# Geometry: defaults to the final aligned geometry, i.e. the alignment carried
# over from an earlier run of the same campaign. That file does not exist until
# the alignment chain has been run once -- until then, point this at an earlier
# geometry with an unprefixed -o override (it is a global [Corryvreckan] key):
#     -o detectors_file=../geometry/prealigned.conf
# Correlations and hitmaps are already useful with a rough geometry; the
# tracking and residual canvases only become meaningful once aligned.

[Corryvreckan]
log_level  = "STATUS"
log_format = "DEFAULT"
detectors_file   = "../geometry/aligned_dut.conf"
output_directory = "../output/online"
histogram_file   = "online.root"
number_of_events = -1

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; --sim-data (or -o EventLoaderMALTA.real_data=false) for Malta2TreeWriter sim
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../../data"  # relative to output_directory, NOT to this file -- see header
run_number = 0  # overridden at launch via -o

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[Correlations]

# Deliberately looser than analysis.conf: no require_detectors and 5 hits
# instead of 6, so a single plane dropping out mid-run does not silently take
# the whole tracking display with it (the Timeline canvas still shows the drop).
[Tracking4D]
track_model = "straightline"
momentum = 3GeV
min_hits_on_track = 6
require_detectors = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
time_cut_abs = 10ns
exclude_dut = true
spatial_cut_abs = 100um, 100um
reject_by_roi = false

[DUTAssociation]
spatial_cut_abs = 100um, 100um
time_cut_abs = 18ns
use_cluster_centre = true

# The point of the beam test, live. Same cuts as analysis.conf so the number on screen is
# comparable to the offline one -- note the track sample is not identical, since Tracking4D
# above is deliberately looser than the analysis chain.
# (No [AnalysisDUT]: the DUT residuals on screen are computed by OnlineMonitor itself, and
# AnalysisDUT would book ~4 GB of histograms the monitor never shows.)
[AnalysisEfficiency]
time_cut_frameedge = 0ns
chi2ndof_cut = 10.0
time_cut_abs = 18ns
elliptic_cut = false

[OnlineMonitor]
update = 200
canvas_title = "MALTA2 Telescope @ PF-AR -- Online Monitor"
clustering_module = "Clustering4D"
tracking_module = "Tracking4D"

# MALTA2's Corryvreckan event definition can overcount (see EventLoaderMALTA's
# README): every l1id becomes an event, even one only a single plane saw. The
# displayed Events count (and target_events below) therefore only
# counts l1ids whose hits coincide on every non-DUT reference plane. DUTs are
# exempt, so DUT inefficiency does not stall it.
target_events = 500000

# Snapshot every minute so the run can be reviewed afterwards. Like base_path
# this is relative to output_directory, so this lands in output/online/snapshots/.
# The directory is NOT created automatically -- mkdir it before starting, and
# keep the trailing slash (the module concatenates the filename onto this string).
auto_save_interval = 60
auto_save_dir = "snapshots/"

# MALTA2 is a binary readout: there is no per-pixel charge, so the Overview's
# charge plot is replaced by tracking quality. (Cluster Size and the DUT canvas
# -- hitmap, local residual X/Y, chip efficiency map -- are already MALTA2-ready
# by default.)
# NOTE: corry's config parser has no line continuation -- a matrix like this
# must stay on a single line, however long it gets.
overview = [["Tracking4D/trackChi2ndof"], ["Tracking4D/tracksPerEvent", "log"], ["Correlations/%REFERENCE%/hitmap", "colz"], ["Tracking4D/%REFERENCE%/local_residuals/LocalResidualsX"]]
