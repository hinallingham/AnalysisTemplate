# Main analysis with upstream-only tracking: tracks from the 3 upstream reference planes
# (MALTA_0, MALTA_1, MALTA_2) only, extrapolated to the DUT (MALTA_3). Everything else as
# in analysis.conf, on the same 6-plane-aligned geometry (aligned_dut.conf).
#
# The downstream planes MALTA_4..6 are not read at all (left out of detector_names), so
# they carry no clusters and cannot enter Tracking4D -- it has no per-plane exclude option.
#
# Run via: scripts/run_analysis.py <run_number> --config ../config/analysis_upstream3.conf

[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file   = "../geometry/aligned_dut.conf"
output_directory = "../output/analysis_upstream3"
histogram_file   = "analysis_upstream3.root"
number_of_events = -1

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; --sim-data (or -o EventLoaderMALTA.real_data=false) for Malta2TreeWriter sim
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3"
base_path = "../data"
run_number = 0  # overridden by scripts/run_analysis.py via -o

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[FilterEvents]

[Correlations]

[Tracking4D]
track_model ="straightline"
momentum = 3GeV
require_detectors = "MALTA_0", "MALTA_1", "MALTA_2"
min_hits_on_track = 3
time_cut_abs = 10ns
exclude_dut = true
spatial_cut_abs = 100um, 100um
reject_by_roi = false

[DUTAssociation]
spatial_cut_abs = 100um, 100um
time_cut_abs = 18ns
use_cluster_centre = true

[AnalysisDUT]
correlations = true
time_cut_frameedge = 0ns
use_closest_cluster = true

[AnalysisEfficiency]
time_cut_frameedge = 0ns
chi2ndof_cut = 10.0
time_cut_abs = 18ns
elliptic_cut = false
