# Main analysis skeleton -- built on top of the fully aligned geometry.
# Grow this file with whatever AnalysisXxx modules the physics question of
# the day needs (AnalysisEfficiency, AnalysisTiming, ...); the modules
# below are just a minimal DUT-efficiency-style starting point.
#
# Run via: scripts/run_analysis.py <run_number> --data-dir <path>

[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file   = "../geometry/aligned_dut.conf"
output_directory = "../output/analysis"
histogram_file   = "analysis.root"
number_of_events = -1

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; --sim-data (or -o EventLoaderMALTA.real_data=false) for Malta2TreeWriter sim
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/run_analysis.py via -o

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[FilterEvents]

[Correlations]

[Tracking4D]
track_model ="straightline"
momentum = 3GeV
require_detectors = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
min_hits_on_track = 6
time_cut_abs = 10ns
exclude_dut = true
spatial_cut_abs = 100um, 100um
reject_by_roi = false

[DUTAssociation]
spatial_cut_abs = 100um, 100um
time_cut_abs = 18ns
use_cluster_centre = true

[AnalysisDUT]
correlations = true
time_cut_frameedge = 0ns
use_closest_cluster = true

[AnalysisEfficiency]
time_cut_frameedge = 0ns
chi2ndof_cut = 10.0
time_cut_abs = 18ns
elliptic_cut = false
