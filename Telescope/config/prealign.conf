# Step 2: Prealignment -- coarse X/Y shifts from correlation histograms.
# The DUT (MALTA_3) is fixed here since it should not be pulled around by
# a crude correlation-based estimate; Alignment (Millepede) later handles
# its position as usual within the track fit.
#
# Run via: scripts/Prealignment.py <run_number> --data-dir <path>

[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/masked.conf"
detectors_file_updated = "../geometry/prealigned.conf"
output_directory       = "../output/prealign"
histogram_file         = "prealign.root"
number_of_events = 200000

[EventLoaderMALTA]
real_data = true
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/Prealignment.py via -o

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[Correlations]

[Prealignment]
method = "gauss_fit"
