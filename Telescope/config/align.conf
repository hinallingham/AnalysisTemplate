# Step 3: Alignment -- Millepede simultaneous track+alignment fit over the
# 6 MALTA2 reference planes. The DUT (MALTA_3) is excluded from tracking
# and from the alignment fit itself.
#
# Run via: scripts/Alignment.py <run_number> --data-dir <path>

[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/prealigned.conf"
detectors_file_updated = "../geometry/aligned.conf"
output_directory       = "../output/align"
histogram_file         = "align.root"
workers = 4
number_of_events = 10000

[EventLoaderMALTA]
real_data = true
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/Alignment.py via -o

[ClusteringSpatial]
charge_weighting = false
reject_by_roi = false

[FilterEvents]
max_clusters_per_plane = 1

[Correlations]

[Tracking4D]
track_model = "straightline"
require_detectors = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
min_hits_on_track = 6
exclude_dut = true
spatial_cut_abs = 100um, 100um

[AlignmentMillepede]
iterations = 10
exclude_dut = true
dofs = true, true, false, true, true, true
residual_cut = 0.05mm
residual_cut_init = 0.6mm
