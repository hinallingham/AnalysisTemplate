# Step 1: NoiseMasking -- find noisy/dead pixels on each of the 7 planes
# and bake the resulting mask files into geometry/masked.conf.
#
# Run via: scripts/NoiseMasking.py <run_number> --data-dir <path>

[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/init.conf"
detectors_file_updated = "../geometry/masked.conf"
output_directory       = "../output/mask"
histogram_file         = "mask.root"
number_of_events = 200000

[EventLoaderMALTA]
real_data = true
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/NoiseMasking.py via -o

[MaskCreator]
method = "frequency"
frequency_cut = 50
mask_dead_pixels = true
write_new_config = true
