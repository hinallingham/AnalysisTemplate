# Step 4: AlignmentDUTResidual -- fine-tune the DUT (MALTA_3) on top of the
# already-Millepede-aligned reference planes. Tracks are fit from the 6 RPs
# only (DUT excluded from tracking, same as align.conf); the DUT's own
# associated cluster is then used purely as an unbiased residual to move
# just that one plane. Run this AFTER Alignment.py.
#
# Run via: scripts/AlignmentDUT.py <run_number> --data-dir <path>

[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/aligned.conf"
detectors_file_updated = "../geometry/aligned_dut.conf"
output_directory       = "../output/align_dut"
histogram_file         = "align_dut.root"
workers = 4
number_of_events = 10000

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; --sim-data (or -o EventLoaderMALTA.real_data=false) for Malta2TreeWriter sim
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_3", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/AlignmentDUT.py via -o

[ClusteringSpatial]
charge_weighting = false
reject_by_roi = false

[Tracking4D]
track_model = "straightline"
require_detectors = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
min_hits_on_track = 6
exclude_dut = true
spatial_cut_abs = 100um, 100um

[DUTAssociation]
spatial_cut_abs = 100um, 100um
time_cut_abs = 18ns
use_cluster_centre = true

[AlignmentDUTResidual]
iterations=4
align_position=true
# align_position_axes=xy
# align_orientation_axes= "xyz"
align_position_axes= xyz
max_track_chi2ndof=2
