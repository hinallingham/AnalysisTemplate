# Step 2 -- prealignment from the hit correlations (alignment run).
[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/masked.conf"
detectors_file_updated = "../geometry/prealigned.conf"
output_directory       = "../output/prealign"
histogram_file         = "prealign.root"
number_of_events = 200000

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; scripts/run_imaging.sh --sim-data sets false for Malta2TreeWriter (Allpix) data
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/run_imaging.sh via -o

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[Correlations]

[Prealignment]
method = "gauss_fit"
