# Step 3 -- Millepede alignment of the 6 planes on the alignment run (no sample in the beam,
# so straight 6-plane tracks are a valid model; with the sample in, the kinks at z = 0
# would pull the alignment).
[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/prealigned.conf"
detectors_file_updated = "../geometry/aligned.conf"
output_directory       = "../output/align"
histogram_file         = "align.root"
number_of_events = 50000

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; scripts/run_imaging.sh --sim-data sets false for Malta2TreeWriter (Allpix) data
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/run_imaging.sh via -o

[ClusteringSpatial]
charge_weighting = false
reject_by_roi = false

[FilterEvents]
max_clusters_per_plane = 1

[Correlations]

[Tracking4D]
track_model = "straightline"
require_detectors = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
min_hits_on_track = 6
spatial_cut_abs = 100um, 100um

[AlignmentMillepede]
iterations = 10
dofs = true, true, false, true, true, true
residual_cut = 0.05mm
residual_cut_init = 0.6mm
