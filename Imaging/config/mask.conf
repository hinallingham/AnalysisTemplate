# Step 1 -- noise masking (on the alignment run).
[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file         = "../geometry/init.conf"
detectors_file_updated = "../geometry/masked.conf"
output_directory       = "../output/mask"
histogram_file         = "mask.root"
number_of_events = 200000

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; scripts/run_imaging.sh --sim-data sets false for Malta2TreeWriter (Allpix) data
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/run_imaging.sh via -o

[MaskCreator]
method = "frequency"
frequency_cut = 50
# false: with a ~cm beam spot most pixels see only a handful of hits, and "dead" (= no hit in
# this run) would mask pixels that do get hits in the imaging run, silently dropping them.
mask_dead_pixels = false
write_new_config = true
