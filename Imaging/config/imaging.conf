# Step 4 -- material-budget imaging on the sample run, with the geometry from align.conf.
#
# TrackingMultiplet fits an upstream (MALTA_0-2) and a downstream (MALTA_4-6) tracklet,
# matches them at the scatterer plane z = 0 and stores the kink angle; AnalysisMaterialBudget
# maps the width of the kink-angle distribution per image cell (Jansen et al.,
# doi:10.1063/1.5005503). The width is NOT converted to x/X0 -- that needs a calibration run
# with known material (e.g. Al foils) in the same setup.
[Corryvreckan]
log_level  = "INFO"
log_format = "DEFAULT"
detectors_file   = "../geometry/aligned.conf"
output_directory = "../output/imaging"
histogram_file   = "imaging.root"
number_of_events = -1

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; scripts/run_imaging.sh --sim-data sets false for Malta2TreeWriter (Allpix) data
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"
run_number = 0  # overridden by scripts/run_imaging.sh via -o

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[TrackingMultiplet]
upstream_detectors   = "MALTA_0", "MALTA_1", "MALTA_2"
downstream_detectors = "MALTA_4", "MALTA_5", "MALTA_6"
# 1um, not 0: TrackingMultiplet initialises max_z_upstream with numeric_limits<double>::min()
# (= +2e-308, not the lowest value), so with every upstream plane at z < 0 a scatterer at
# exactly 0 is rejected as "in front of last upstream detector". 1 um changes nothing.
scatterer_position = 1um
# A 1.6 mm MLCC kinks 3 GeV e- by ~1 mrad (rms); over C = 15 mm the arms still meet at
# z = 0 within a few um, so the matching cut only has to reject accidental pairs.
scatterer_matching_cut = 200um
time_cut_abs = 10ns
spatial_cut_abs = 150um, 150um
track_model = "straightline"
kink_x_low = -10
kink_x_high = 10
kink_x_granularity = 400
kink_y_low = -10
kink_y_high = 10
kink_y_granularity = 400

[AnalysisMaterialBudget]
image_size = 18mm 9mm
cell_size = 100um 100um
angle_cut = 20mrad
quantile = 0.9
min_cell_content = 20
