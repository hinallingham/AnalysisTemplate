# Online monitor for material-budget imaging -- run this ALONGSIDE an active data-taking run to
# watch the sample image build up: kink-angle distributions, upstream/downstream matching at the
# scatterer, the live kink^2 map per cell, plus the usual hitmaps / correlations / DAQ health.
# It reads the run files while MaltaDAQ is still writing them, and never writes a geometry back.
#
# Run via (picks the setup's best geometry, absolute base_path, snapshots dir):
#     scripts/run_online.sh --setup dec2026_EDA --run <run>
#
# Same tracking and imaging cuts as imaging.conf, so the live picture matches the offline one.
# TrackingMultiplet is the ONLY tracker here: a Tracking4D next to it would put a second set of
# tracks on the clipboard, which AnalysisMaterialBudget would then image as well.
#
# The live map is AnalysisMaterialBudget/MBIpreview (mean kink^2 per cell, filled event by event);
# MBISqrt, the quantile width that plot_imaging.py shows, is only computed at the end of the run.
# Needs a display (X11). Keyboard: Space = pause, F = full screen, S = save PNG, 1-9 = canvases.

[Corryvreckan]
log_level  = "STATUS"
log_format = "DEFAULT"
detectors_file   = "../geometry/aligned.conf"   # overridden by scripts/run_online.sh
output_directory = "../output/online"            # overridden by scripts/run_online.sh
histogram_file   = "online.root"
number_of_events = -1

[EventLoaderMALTA]
real_data = true  # MaltaDAQ beam-test data; scripts/run_online.sh --sim-data sets false for Malta2TreeWriter (Allpix) data
detector_names = "MALTA_0", "MALTA_1", "MALTA_2", "MALTA_4", "MALTA_5", "MALTA_6"
base_path = "../data"  # overridden (absolute) by scripts/run_online.sh: corry chdir's into output_directory
run_number = 0  # overridden by scripts/run_online.sh

[Clustering4D]
charge_weighting = false
time_cut_abs = 200ns
reject_by_roi = false

[Correlations]

[TrackingMultiplet]
upstream_detectors   = "MALTA_0", "MALTA_1", "MALTA_2"
downstream_detectors = "MALTA_4", "MALTA_5", "MALTA_6"
scatterer_position = 1um  # not 0, see imaging.conf
scatterer_matching_cut = 200um
time_cut_abs = 10ns
spatial_cut_abs = 150um, 150um
track_model = "straightline"
kink_x_low = -10
kink_x_high = 10
kink_x_granularity = 400
kink_y_low = -10
kink_y_high = 10
kink_y_granularity = 400

[AnalysisMaterialBudget]
image_size = 18mm 9mm
cell_size = 200um 200um  # coarser than imaging.conf (100um): fills up within minutes of beam
angle_cut = 20mrad
quantile = 0.9
min_cell_content = 20

[OnlineMonitor]
update = 200
canvas_title = "MALTA2 Telescope @ PF-AR -- Imaging Online Monitor"
clustering_module = "Clustering4D"
tracking_module = "TrackingMultiplet"
target_events = 2000000
auto_save_interval = 60
auto_save_dir = "snapshots/"  # relative to output_directory; created by scripts/run_online.sh

# NOTE: corry's config parser has no line continuation -- each matrix must stay on one line.
# Overview: the live image, the kink angle and the arm matching -- the three things to watch.
overview = [["AnalysisMaterialBudget/MBIpreview", "colz"], ["TrackingMultiplet/multipletKinkAtScattererX"], ["TrackingMultiplet/matchingDistanceAtScattererX"], ["AnalysisMaterialBudget/entriesPerCell", "log"]]
tracking = [["TrackingMultiplet/multipletMultiplicity", "log"], ["TrackingMultiplet/trackChi2ndof"], ["TrackingMultiplet/multipletKinkAtScattererX"], ["TrackingMultiplet/multipletKinkAtScattererY"], ["TrackingMultiplet/matchingDistanceAtScattererX"], ["TrackingMultiplet/matchingDistanceAtScattererY"]]
residuals = [["TrackingMultiplet/%DETECTOR%/local_residuals_chosen/LocalResidualsX"]]
residuals_y = [["TrackingMultiplet/%DETECTOR%/local_residuals_chosen/LocalResidualsY"]]
