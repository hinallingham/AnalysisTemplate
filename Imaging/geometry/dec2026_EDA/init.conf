# Corryvreckan detector geometry -- setup 'dec2026_EDA' (initial, ideal placement),
# December 2026 PF-AR beam test, material imaging: measured EDA-board positions, z = 0 at the
# RD53B plane, where the sample sits; the beam enters at plane 1 (MALTA_0).
# Copied from geometry/template/init.conf; when the layout changes, edit the "EDIT" lines
# (z of each plane) or copy the template to a new setup directory.
#
#   MALTA_0   MALTA_1   MALTA_2  [sample]  MALTA_4  MALTA_5   MALTA_6
#   -281.65   -171.65   -61.65    0        +48.35   +158.35   +268.35   mm
#
# Only z is set; x/y offsets and rotations are found by the alignment chain, which writes
# masked / prealigned / aligned .conf next to this file. The names keep the 7-plane numbering
# (slot 3 = DUT slot left empty); EventLoaderMALTA.detector_names maps them to file index 0..5.

[MALTA_0]
coordinates = "cartesian"
type = "MALTA2"
position = 0um, 0um, -385mm   # <-- EDIT: z of this plane
orientation_mode = "xyz"
orientation = 0deg, 0deg, 0deg
alignment_precision_position = 0um 0um 0um
alignment_precision_orientation = 0deg 0deg 0deg
pixel_pitch = 36.4um, 36.4um
number_of_pixels = 512, 224
spatial_resolution = 10.5um, 10.5um
time_resolution = 5ns
role = "reference"
material_budget = 0.00106768

