# Corryvreckan detector geometry -- TEMPLATE for a new material-imaging setup (initial, ideal placement).
#
# 6 MALTA2 reference planes on a straight beam axis, beam along +z. The sample sits at z = 0
# (the DUT slot, MALTA_3, is left empty; TrackingMultiplet's scatterer_position is at z = 0).
# Make a new setup by copying this directory to geometry/<NAME>/ and editing only the
# lines marked "EDIT" below (z of each plane, upstream first).
# Then analyse with  scripts/run_imaging.sh --setup <NAME> --align-run <RUN> --image-run <RUN> ...
#
# Only z has to be right (to ~1 mm); x/y offsets and rotations are found by Prealignment / Alignment.
# The names keep the 7-plane telescope numbering (slot 3 = DUT slot left empty); the order of
# EventLoaderMALTA.detector_names maps them to file index 0..5.
#
# Values below = dec2026_EDA (measured EDA-board positions, z = 0 at the RD53B / sample plane):
#   MALTA_0   MALTA_1   MALTA_2  [sample]  MALTA_4  MALTA_5   MALTA_6
#   -281.65   -171.65   -61.65    0        +48.35   +158.35   +268.35   mm

[MALTA_0]
coordinates = "cartesian"
type = "MALTA2"
position = 0um, 0um, -281.65mm   # <-- EDIT: z of this plane
orientation_mode = "xyz"
orientation = 0deg, 0deg, 0deg
alignment_precision_position = 0um 0um 0um
alignment_precision_orientation = 0deg 0deg 0deg
pixel_pitch = 36.4um, 36.4um
number_of_pixels = 512, 224
spatial_resolution = 10.5um, 10.5um
time_resolution = 5ns
role = "reference"
material_budget = 0.00106768

